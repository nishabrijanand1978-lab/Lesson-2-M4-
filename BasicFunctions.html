<!DOCTYPE html>
<html>
    <head></head>

    <body>
        <button onclick="MyFunction(10)">Execute JS function</button>

        <script>
            function MyFunction(x, y)
            {

                if (y=== undefined) {
                    y = 2;
                }
                document.write(x*y);
            }
        </script>
    </body>
